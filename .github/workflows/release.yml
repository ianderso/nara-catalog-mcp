name: Release

# Publishing a GitHub release builds its tag and uploads it to PyPI. PyPI
# trusts this workflow through Trusted Publishing, so no token is stored
# anywhere: the publish job gets a short-lived credential from GitHub, and
# only through the pypi environment, which accepts v* tags and main.
#
# Every action here is pinned to a commit rather than a tag, because the
# publish job holds that credential. Dependabot keeps the pins current.
on:
  release:
    types: [published]
  # For a tag released before this workflow existed. Run it from main.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only a tag is ever built, never a branch or a bare commit.
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          # A release build starts clean: nothing restored from a cache that
          # another workflow could have written.
          enable-cache: false
      - run: uv build
      - name: Check the tag names the version that was built
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ ! -f "dist/nara_catalog_mcp-${TAG#v}-py3-none-any.whl" ]; then
            echo "::error::Tag $TAG does not match the built version: $(ls dist)"
            exit 1
          fi
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nara-catalog-mcp
    permissions:
      # Trusted Publishing: exchanged with PyPI for a token scoped to this
      # project, valid for minutes. Also signs the upload's attestations.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
