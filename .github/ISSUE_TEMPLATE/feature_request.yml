name: Feature request
description: A research question the tools cannot answer yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tools that write to the Catalog (posting tags or comments, submitting transcriptions) will not be merged. See "Out of scope, by decision" in [docs/DESIGN.md](https://github.com/ianderso/nara-catalog-mcp/blob/main/docs/DESIGN.md).
  - type: textarea
    id: problem
    attributes:
      label: The research problem
      description: What you were trying to find or read, and where the current tools stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A new tool, a new parameter, or a change to what a tool returns.
  - type: textarea
    id: api
    attributes:
      label: Catalog API route or parameter
      description: If you know which part of the API would answer it. docs/API-NOTES.md lists what the server sends and what it deliberately does not.
